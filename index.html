<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rick and Morty Character</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 400px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 24px;
        }

        .character-card {
            display: none;
        }

        .character-card.active {
            display: block;
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .character-image {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            margin: 0 auto 20px;
            border: 5px solid #667eea;
            object-fit: cover;
        }

        .character-name {
            font-size: 28px;
            color: #333;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .character-status {
            font-size: 16px;
            color: #666;
            margin-bottom: 5px;
        }

        .character-species {
            font-size: 14px;
            color: #999;
        }

        .loading {
            font-size: 18px;
            color: #667eea;
        }

        .error {
            color: #e74c3c;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Rick and Morty Character</h1>
        <div class="loading" id="loading">Завантаження...</div>
        <div class="error" id="error" style="display: none;"></div>
        <div class="character-card" id="characterCard">
            <img class="character-image" id="characterImage" src="" alt="">
            <div class="character-name" id="characterName"></div>
            <div class="character-status" id="characterStatus"></div>
            <div class="character-species" id="characterSpecies"></div>
        </div>
    </div>

    <script>
        const API_URL = 'https://rickandmortyapi.com/api/character/2';

        const loading = document.getElementById('loading');
        const error = document.getElementById('error');
        const characterCard = document.getElementById('characterCard');
        const characterImage = document.getElementById('characterImage');
        const characterName = document.getElementById('characterName');
        const characterStatus = document.getElementById('characterStatus');
        const characterSpecies = document.getElementById('characterSpecies');

        async function fetchCharacter() {
            try {
                const response = await fetch(API_URL);
                
                if (!response.ok) {
                    throw new Error('Помилка завантаження даних');
                }

                const character = await response.json();
                displayCharacter(character);
            } catch (err) {
                showError('Не вдалося завантажити персонажа. Спробуйте пізніше.');
                console.error('Error:', err);
            }
        }

        function displayCharacter(character) {
            loading.style.display = 'none';
            characterCard.classList.add('active');

            characterImage.src = character.image;
            characterImage.alt = character.name;
            characterName.textContent = character.name;
            characterStatus.textContent = `Статус: ${character.status}`;
            characterSpecies.textContent = `Вид: ${character.species}`;
        }

        function showError(message) {
            loading.style.display = 'none';
            error.textContent = message;
            error.style.display = 'block';
        }

        fetchCharacter();
    </script>
</body>
</html>
