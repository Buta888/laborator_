<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rick and Morty Character</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Rick and Morty Character</h1>
        <div class="loading" id="loading">Завантаження...</div>
        <div class="error" id="error" style="display: none;"></div>
        <div class="character-card" id="characterCard">
            <img class="character-image" id="characterImage" src="" alt="">
            <div class="character-name" id="characterName"></div>
            <div class="character-status" id="characterStatus"></div>
            <div class="character-species" id="characterSpecies"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
